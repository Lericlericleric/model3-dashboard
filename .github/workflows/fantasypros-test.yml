
name: Test FantasyPros API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check FantasyPros projections
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error

          key = os.environ.get("FANTASYPROS_API_KEY")
          if not key:
              raise SystemExit("API secret is missing.")

          url = "https://api.fantasypros.com/public/v2/json/nfl/2026/projections?position=RB&week=5"
          request = urllib.request.Request(
              url, headers={"x-api-key": key}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"API returned HTTP {e.code}")

          players = data.get("players", [])
          print("Season:", data.get("season"))
          print("Week:", data.get("week"))
          print("Reported count:", data.get("count"))
          print("Players returned:", len(players))
          print("Fields:", list(players[0]) if players else [])
          print("No player data saved or published.")
          PY
