
name: Update NFL model
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build NFL forecasts
        run: python scripts/build_nfl.py
      - name: Commit updated model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL Elo forecasts"
            git push
          fi
